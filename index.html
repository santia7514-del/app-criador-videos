<!DOCTYPE html>
<html>
<head>
  <title>Gerador de Roteiro</title>
</head>

<body style="background:black; color:white; text-align:center; font-family:sans-serif;">

<h1>Gerador de Roteiro</h1>

<input id="produto" placeholder="Digite o produto"><br><br>
<input id="link" placeholder="Cole o link do produto"><br><br>

<button onclick="gerar()">GERAR</button>

<div id="resultado" style="margin-top:20px;"></div>

<script>

function gerar() {

  var produto = document.getElementById("produto").value;
  var link = document.getElementById("link").value;

  fetch("https://criador-videos-api.onrender.com/gerar", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      produto: produto,
      link: link
    })
  })
  .then(res => res.json())
  .then(data => {

    let html = `<h2>ROTEIRO</h2><pre>${data.roteiro}</pre>`;

    html += `<h2>CENAS</h2>`;

    data.cenas.forEach(c => {
      html += `
        <div style="margin-bottom:20px;">
          <strong>CENA ${c.cena}</strong><br>
          📷 ${c.texto}<br>
          🎤 ${c.narracao}
        </div>
      `;
    });

    html += `<h2>LEGENDA</h2><p>${data.legenda}</p>`;

    document.getElementById("resultado").innerHTML = html;

  })
  .catch(() => {
    document.getElementById("resultado").innerHTML = "Erro ao gerar conteúdo";
  });

}

</script>

</body>
</html>
