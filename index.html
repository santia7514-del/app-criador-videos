<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Roteiros</title>
</head>
<body style="font-family: Arial; padding:20px; background:#111; color:#fff;">

  <h1>Gerador de Roteiro + VEO3</h1>

  <input id="produto" placeholder="Digite o produto" style="padding:10px; width:300px;">
  <button onclick="gerar()" style="padding:10px;">Gerar</button>

  <div id="resultado" style="margin-top:20px;"></div>

  <script>
    async function gerar() {
      const produto = document.getElementById("produto").value;

      document.getElementById("resultado").innerHTML = "Gerando...";

      const res = await fetch("https://SEU-BACKEND.onrender.com/gerar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ produto })
      });

      const data = await res.json();

      let html = `<h2>ROTEIRO</h2>
      <pre style="white-space: pre-wrap;">${data.roteiro}</pre>`;

      html += `<h2>CENAS</h2>`;

      data.cenas.forEach(c => {
        html += `
        <div style="margin-bottom:20px;">
          <strong>CENA ${c.cena}</strong><br>
          📺 ${c.texto}<br>
          🎤 ${c.narracao}
        </div>`;
      });

      html += `<h2>LEGENDA</h2><p>${data.legenda}</p>`;

      html += `<h2>PROMPT VEO3</h2>
      <pre style="white-space: pre-wrap; background:#000; padding:10px;">
      ${data.prompt_veo3}
      </pre>`;

      document.getElementById("resultado").innerHTML = html;
    }
  </script>

</body>
</html>
