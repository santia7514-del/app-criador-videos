<!DOCTYPE html>
<html>
<head>
  <title>Gerador de Roteiro</title>
</head>

<body style="background:black; color:white; text-align:center; font-family:sans-serif;">

<h1>Gerador de Roteiro</h1>

<input id="produto" placeholder="Digite o produto"><br><br>
<input id="link" placeholder="Cole o link do produto"><br><br>

<button onclick="gerar()">GERAR</button>

<div id="resultado" style="margin-top:20px;"></div>

<script>
function gerar() {

var produto = document.getElementById("produto").value;
var link = document.getElementById("link").value;

var texto = `
<h2>VÍDEO 1 - GANCHO FORTE</h2>
GANCHO: Antes de comprar ${produto}, olha isso aqui...
DOR: Eu tentei resolver isso de várias formas e nada funcionava
SOLUÇÃO: Depois que usei isso, resolveu em segundos
PROVA: Olha isso funcionando na prática
CTA: Compre aqui → ${link}

<hr>

<h2>VÍDEO 2 - DOR</h2>
GANCHO: Você não precisa passar por isso
DOR: A maioria das pessoas sofre com esse problema
SOLUÇÃO: Com ${produto}, ficou muito mais fácil
PROVA: Testei e funciona de verdade
CTA: Compre aqui → ${link}

<hr>

<h2>VÍDEO 3 - DEMONSTRAÇÃO</h2>
GANCHO: Vou te mostrar isso funcionando agora
DEMO: Olha o produto em ação
BENEFÍCIO: Rápido, simples e eficiente
PROVA: Resultado real
CTA: Compre aqui → ${link}
`;

document.getElementById("resultado").innerHTML = texto;

}
</script>

</body>
</html>
